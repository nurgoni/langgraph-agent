# Stack lokal: Postgres, migrasi, service API (:8080), frontend React (:3000), dev console
# Streamlit (:8501), dan sandbox eksekusi kode (sandbox-runner, tanpa port di host).
#   docker compose up --build
#   docker compose up -d postgres     # hanya database, untuk dev lokal dan test
#   docker compose exec agent-service python -m agent_service.manage create-user demo
# Default-nya FakeModel, jadi stack berjalan tanpa API key. Untuk LLM asli, tambahkan
# compose.llm.yaml (lihat README).
name: agent-service

# Kredensial dev. Nilainya sama dengan DEFAULT_DATABASE_URL di core/constants.py, jadi
# `uv run python -m agent_service.run_service` di host langsung terhubung ke service postgres.
x-database-url: &database-url "postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agent_service}"
# Hanya untuk stack lokal/demo. Di luar mesin dev, set JWT_SECRET sendiri (lihat .env.example).
x-jwt-secret: &jwt-secret "${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}"
# Token antara agent-service dan sandbox-runner (F37). Sama: set SANDBOX_TOKEN sendiri di luar dev.
x-sandbox-token: &sandbox-token "${SANDBOX_TOKEN:-dev-only-insecure-sandbox-token-change-me}"

services:
  postgres:
    # Image pgvector supaya fitur RAG (F43) tidak perlu mengganti image.
    image: pgvector/pgvector:0.8.1-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
    ports:
      # Hanya loopback: dipakai service di host saat dev dan oleh test database.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 menyimpan data di subfolder per versi, jadi yang di-mount adalah induknya.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    # Sekali jalan: migrasi Alembic + tabel checkpointer, lalu selesai. Service API baru start
    # setelah migrasi sukses, jadi beberapa replika tidak pernah menjalankan migrasi bersamaan.
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: service
    image: agent-service:local
    command: ["python", "-m", "agent_service.run_migrate"]
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: *jwt-secret
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      USE_FAKE_MODEL: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: service
    image: agent-service:local
    ports:
      - "${SERVICE_PORT:-8080}:8080"
    environment:
      # Ditulis eksplisit, bukan env_file: konfigurasi LLM di .env (misalnya LLM_BASE_URL ke
      # localhost) tidak berlaku dari dalam container. Yang diambil dari .env hanya JWT_SECRET,
      # JWT_TTL_SECONDS, CORS_ORIGINS, LOG_LEVEL, FIRECRAWL_API_KEY, ARTIFACT_MAX_BYTES, dan
      # kredensial POSTGRES_*.
      USE_FAKE_MODEL: "true"
      DEFAULT_MODEL: fake
      AVAILABLE_MODELS: fake
      DATABASE_URL: *database-url
      JWT_SECRET: *jwt-secret
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Kosong: tool web_search menjawab "not configured", agent tetap berjalan.
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      # Artifact (F35): isi file di volume `artifacts`, metadata di Postgres.
      ARTIFACT_DIR: /app/data/artifacts
      ARTIFACT_MAX_BYTES: ${ARTIFACT_MAX_BYTES:-}
      # Sandbox (F37): kode model dijalankan lewat sandbox-runner, bukan di container ini.
      SANDBOX_URL: http://sandbox-runner:8080
      SANDBOX_TOKEN: *sandbox-token
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-}
    volumes:
      - artifacts:/app/data/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
      sandbox-runner:
        condition: service_healthy
    restart: unless-stopped

  # Image eksekusi kode (F37). Service ini hanya membangun image lalu selesai; runner membuat
  # container sekali pakai dari image ini untuk setiap eksekusi.
  sandbox-image:
    build:
      context: docker
      dockerfile: sandbox.Dockerfile
    image: agent-service-sandbox:local
    network_mode: none
    restart: "no"

  # Satu-satunya service dengan akses Docker (keputusan user F37). Tanpa port di host; hanya
  # agent-service yang memanggilnya, dengan SANDBOX_TOKEN.
  sandbox-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sandbox-runner
    image: agent-service-sandbox-runner:local
    environment:
      SANDBOX_TOKEN: *sandbox-token
      SANDBOX_IMAGE: agent-service-sandbox:local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ui
    image: agent-service-ui:local
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      AGENT_URL: http://agent-service:8080
    depends_on:
      agent-service:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Frontend React (F32): file statis + proxy same-origin /api ke agent-service.
    build:
      context: frontend
    image: agent-service-web:local
    ports:
      - "${WEB_PORT:-3000}:8080"
    environment:
      API_UPSTREAM: http://agent-service:8080
      # Batas body upload di proxy; samakan dengan ARTIFACT_MAX_BYTES (+ overhead multipart).
      API_MAX_BODY_SIZE: ${API_MAX_BODY_SIZE:-26m}
    depends_on:
      agent-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  artifacts:
