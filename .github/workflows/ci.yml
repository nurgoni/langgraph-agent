name: CI

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      # Database test (ADR 0001). Image dan kredensial sama dengan compose.yaml, jadi fixture
      # `postgres_database` memakai DEFAULT_DATABASE_URL tanpa konfigurasi tambahan.
      postgres:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_service"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Keep in sync with the uv version used to write uv.lock.
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and format
        run: |
          uv run ruff format --check
          uv run ruff check --output-format github

      - name: Type check
        run: uv run pyrefly check

      - name: Test with coverage
        run: uv run pytest --cov --cov-report=term

  e2e:
    # Docker Compose stack (service + UI) with FakeModel; see tests/integration.
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.18"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compose end-to-end tests
        run: uv run pytest -m integration tests/integration -v
