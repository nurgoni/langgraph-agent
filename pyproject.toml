[project]
name = "agent-service"
version = "0.0.0"
description = "LangGraph agent service with FastAPI streaming, a Python client and a Streamlit UI"
readme = "README.md"
authors = [{ name = "nurgoni" }]
requires-python = ">=3.12,<3.15"
# Runtime dependencies are added by the feature that first needs them (see docs/ROADMAP.md).
dependencies = [
    "langchain-core~=1.6",
    "langchain-openai~=1.7",
    "langgraph~=1.2",
    "langgraph-checkpoint-sqlite~=3.1",
    "pydantic~=2.14",
    "pydantic-settings~=2.16",
]

[dependency-groups]
dev = [
    "pre-commit ~=4.7.0",
    "pyrefly ~=1.4.0",
    "pytest ~=8.4.2",
    "pytest-asyncio ~=1.4.0",
    "pytest-cov ~=7.1.0",
    "ruff ~=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

# Supply-chain cooldown: only resolve releases published before this date.
# Move it forward during dependency refreshes, keeping roughly a 14-day lag.
[tool.uv]
exclude-newer = "2026-10-18T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules -m 'not integration'"
markers = ["integration: needs external services (docker, real LLM); run with -m integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["agent_service"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pyrefly]
project-includes = ["src", "tests"]
