[project]
name = "agent-service"
version = "0.4.0"
description = "LangGraph agent service with FastAPI streaming, a Python client and a Streamlit UI"
readme = "README.md"
authors = [{ name = "nurgoni" }]
requires-python = ">=3.12,<3.15"
# Base install = schema + client only (`pip install agent-service`). Each image installs the extra
# it needs; extras `analytics` and `rag` are added by the feature that first needs them
# (see docs/ROADMAP.md).
dependencies = [
    "httpx~=0.28",
    "pydantic~=2.14",
]

[project.optional-dependencies]
service = [
    "alembic~=1.20",
    "argon2-cffi~=25.1",
    "fastapi~=0.143",
    "langchain-core~=1.6",
    "langchain-openai~=1.7",
    "langgraph~=1.2",
    "langgraph-checkpoint-postgres~=3.2",
    "numexpr~=2.14",
    "psycopg-pool~=3.3",
    "psycopg[binary]~=3.3",
    "pydantic-settings~=2.16",
    "pyjwt~=2.15",
    "pyyaml~=6.0",
    "sqlalchemy[asyncio]~=2.1",
    "uvicorn~=0.54",
]
ui = [
    "pydantic-settings~=2.16",
    "streamlit~=1.66",
]
# Eval runner (F31): talks to the service over HTTP, so it needs no agent dependencies.
evals = [
    "pydantic-settings~=2.16",
    "pyyaml~=6.0",
]

[dependency-groups]
dev = [
    # Self-reference: plain `uv sync`/`uv run` installs every extra for development and CI,
    # while images use `--no-dev --extra <name>`.
    "agent-service[service,ui,evals]",
    "pre-commit ~=4.7.0",
    "pyrefly ~=1.4.0",
    "pytest ~=8.4.2",
    "pytest-asyncio ~=1.4.0",
    "pytest-cov ~=7.1.0",
    "ruff ~=0.17.1",
    "types-pyyaml ~=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

# Supply-chain cooldown: only resolve releases published before this date.
# Move it forward during dependency refreshes, keeping roughly a 14-day lag.
[tool.uv]
exclude-newer = "2026-10-18T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --import-mode=importlib -m 'not integration' --ignore=src/agent_service/memory/migrations"
markers = ["integration: needs external services (docker, real LLM); run with -m integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["agent_service"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pyrefly]
project-includes = ["src", "tests"]
