# Lint, format and type-check hooks run through `uv run` so they always use the
# versions pinned in uv.lock (one source of truth, no drift between hook and dev tool).
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # frontend/pnpm-lock.yaml (pnpm 12) berisi dua dokumen YAML.
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyrefly
        name: pyrefly check
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
      - id: api-contracts
        name: api contracts up to date
        entry: uv run python -m agent_service.export_contracts --check
        language: system
        files: ^(src/agent_service/(schema|service)/|contracts/)
        pass_filenames: false
      - id: frontend-check
        # Tipe API TS sinkron dengan contracts/, lalu typecheck dan lint (F32). Butuh
        # `corepack pnpm install` sekali di frontend/. Corepack membaca `packageManager` dari
        # folder kerja (root repo), bukan dari `--dir`, jadi versinya ditulis eksplisit di sini dan
        # harus sama dengan `frontend/package.json`; jika berbeda, pnpm gagal dengan jelas.
        name: frontend check
        entry: corepack pnpm@12.17.0 --dir frontend run check
        language: system
        files: ^(frontend/|contracts/openapi\.json$)
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
